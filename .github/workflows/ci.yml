name: CI

on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff==0.17.0
      - name: Run ruff
        run: ruff check .
